<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web &amp; Tech — Hero Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=League+Spartan:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0E0E11; }
  #root { height: 100vh; }
  .hero-iframe { width: 100%; height: 100%; border: 0; display: block; background: #0E0E11; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  function Frame({ src }) {
    return <iframe className="hero-iframe" src={src} loading="lazy" title={src}></iframe>;
  }

  function App() {
    return (
      <DesignCanvas>
        <DCSection
          id="web-heroes"
          title="Web & Tech — Hero directions"
          subtitle="All built on the live SCA dark system — drop-in replacements for the current scroll-deck hero. The merged A+B is the lead direction.">
          <DCArtboard id="hero-ab" label="★ A+B Merged · code types → the real ambär site assembles" width={1280} height={900}>
            <Frame src="heroAB-live-coffee.html" />
          </DCArtboard>
          <DCArtboard id="hero-a" label="A · Live Build — code types, site assembles in sync" width={1280} height={820}>
            <Frame src="heroA-live-build.html" />
          </DCArtboard>
          <DCArtboard id="hero-b" label="B · Wireframe → Product — greyboxes morph into a finished site" width={1280} height={820}>
            <Frame src="heroB-wireframe.html" />
          </DCArtboard>
          <DCArtboard id="hero-c" label="C · Performance Flex — live audit gauges race to 100" width={1280} height={820}>
            <Frame src="heroC-performance.html" />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
