document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>SeeTusk — Website Redesign Handover &amp; Build Brief<\u002Ftitle>\n<link href=\"https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&amp;f[]=jetbrains-mono@400,500&amp;display=swap\" rel=\"stylesheet\">\n<style>\n  :root {\n    /* Document ink (light surface, for reading + printing) */\n    --paper: #FFFFFF;\n    --paper-2: #F7F8FA;\n    --ink: #14161A;\n    --ink-2: #43474E;\n    --ink-3: #767B83;\n    --hair: #E4E7EC;\n    --hair-2: #D3D7DE;\n\n    /* TARGET SYSTEM tokens (the dark system being specified) */\n    --t-bg: #0B0B0D;\n    --t-bg-2: #111214;\n    --t-card: #1B1D20;\n    --t-text: #FFFFFF;\n    --t-text-2: #B7BDC6;\n    --t-muted: #80858D;\n    --t-blue: #4F8CFF;\n    --t-purple: #7A5FFF;\n    --t-cyan: #58D5FF;\n\n    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;\n    --sans: 'Satoshi', 'Helvetica Neue', Arial, sans-serif;\n  }\n\n  * { box-sizing: border-box; }\n  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }\n  body {\n    margin: 0;\n    background: var(--paper-2);\n    color: var(--ink);\n    font-family: var(--sans);\n    font-size: 15px;\n    line-height: 1.62;\n    font-weight: 400;\n  }\n\n  .doc {\n    box-sizing: border-box;\n    max-width: 8.5in;\n    margin: 0 auto;\n    background: var(--paper);\n    padding: 0 clamp(22px, 5vw, 0.78in) 120px;\n    box-shadow: 0 1px 60px rgba(20,22,26,.07);\n  }\n  .doc-frame { width: 100%; border-collapse: collapse; }\n  .doc-frame td { padding: 0; }\n  .hdr-space, .ftr-space { display: none; }\n\n  /* ---- Type ---- */\n  h1, h2, h3, h4, h5 { font-family: var(--sans); color: var(--ink); margin: 0; line-height: 1.1; text-wrap: balance; letter-spacing: -0.02em; }\n  h2 { font-size: 27px; font-weight: 900; margin: 0 0 4px; }\n  h3 { font-size: 19px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }\n  h4 { font-size: 15.5px; font-weight: 700; margin: 0 0 4px; letter-spacing: 0; }\n  p { margin: 0 0 13px; text-wrap: pretty; }\n  p, li { color: var(--ink-2); }\n  strong { color: var(--ink); font-weight: 700; }\n  a { color: #2c63cc; text-decoration: none; }\n  em { color: var(--ink-3); font-style: italic; }\n  ul, ol { margin: 0 0 14px; padding-left: 20px; }\n  li { margin-bottom: 6px; }\n  code { font-family: var(--mono); font-size: 0.86em; background: #EEF1F5; padding: 1px 5px; border-radius: 4px; color: #2b2f36; }\n\n  /* ---- Section scaffolding ---- */\n  .section { padding-top: 40px; margin-top: 40px; border-top: 1px solid var(--hair); }\n  .section:first-of-type { border-top: 0; margin-top: 0; }\n  .kicker {\n    font-family: var(--mono); font-size: 11px; font-weight: 500;\n    letter-spacing: 0.18em; text-transform: uppercase; color: var(--t-blue);\n    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;\n  }\n  .kicker::before { content: \"\"; width: 26px; height: 2px; background: var(--t-blue); display: inline-block; }\n  .lead { font-size: 16.5px; line-height: 1.55; color: var(--ink-2); max-width: 64ch; }\n\n  /* ---- Cover ---- */\n  .cover { padding: 64px 0 18px; }\n  .cover-brand { display: flex; align-items: center; gap: 11px; margin-bottom: 40px; }\n  .cover-dot { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, var(--t-blue), var(--t-purple)); box-shadow: 0 4px 18px rgba(79,140,255,.4); }\n  .cover-brand b { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }\n  .cover-brand span { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: .04em; margin-left: auto; }\n  .cover h1 { font-size: clamp(38px, 7vw, 60px); font-weight: 900; line-height: 0.97; letter-spacing: -0.035em; margin: 0 0 22px; max-width: 14ch; }\n  .cover h1 .g { background: linear-gradient(105deg, var(--t-blue), var(--t-purple) 55%, var(--t-cyan)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n  .cover-sub { font-size: 18px; color: var(--ink-2); max-width: 56ch; line-height: 1.5; }\n  .cover-meta { display: flex; flex-wrap: wrap; gap: 0; margin-top: 40px; border: 1px solid var(--hair); border-radius: 12px; overflow: hidden; }\n  .cover-meta div { flex: 1 1 25%; min-width: 130px; padding: 15px 18px; border-right: 1px solid var(--hair); }\n  .cover-meta div:last-child { border-right: 0; }\n  .cover-meta dt { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px; }\n  .cover-meta dd { margin: 0; font-size: 13.5px; font-weight: 600; color: var(--ink); }\n\n  /* ---- Prompt blocks (the Lovable copy-paste payloads) ---- */\n  .prompt {\n    position: relative;\n    background: var(--t-bg);\n    color: #E8EAED;\n    border-radius: 14px;\n    padding: 44px 22px 22px;\n    margin: 18px 0 22px;\n    font-family: var(--mono);\n    font-size: 12.5px;\n    line-height: 1.65;\n    white-space: pre-wrap;\n    overflow-wrap: break-word;\n    border: 1px solid #26282d;\n  }\n  .prompt::before {\n    content: \"⌘ PASTE INTO LOVABLE\";\n    position: absolute; top: 0; left: 0; right: 0;\n    padding: 9px 18px;\n    font-size: 10px; letter-spacing: .18em; font-weight: 500;\n    color: #8d93ad;\n    background: linear-gradient(90deg, rgba(79,140,255,.16), rgba(122,95,255,.1));\n    border-bottom: 1px solid #26282d;\n    border-radius: 14px 14px 0 0;\n  }\n  .prompt b { color: var(--t-cyan); font-weight: 500; }\n  .prompt .hl { color: #FFD479; }\n  .prompt-label { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: .04em; margin: 22px 0 -8px; }\n\n  /* ---- Callouts ---- */\n  .note, .warn, .keep {\n    border-radius: 12px; padding: 15px 18px; margin: 16px 0; font-size: 14px; line-height: 1.55;\n    border: 1px solid var(--hair); background: var(--paper-2);\n  }\n  .note { border-left: 3px solid var(--t-blue); }\n  .warn { border-left: 3px solid #E8833A; background: #FFF8F1; }\n  .keep { border-left: 3px solid #2BA169; background: #F2FBF6; }\n  .note .lbl, .warn .lbl, .keep .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; display: block; margin-bottom: 4px; }\n  .note .lbl { color: #2c63cc; } .warn .lbl { color: #c46512; } .keep .lbl { color: #1f8a59; }\n  .note p:last-child, .warn p:last-child, .keep p:last-child { margin-bottom: 0; }\n\n  /* ---- Tables ---- */\n  table.spec { width: 100%; border-collapse: collapse; margin: 14px 0 20px; font-size: 13px; }\n  table.spec th, table.spec td { text-align: left; padding: 9px 11px; border-bottom: 1px solid var(--hair); vertical-align: top; }\n  table.spec thead th { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; border-bottom: 1.5px solid var(--hair-2); }\n  table.spec td:first-child { color: var(--ink); font-weight: 600; white-space: nowrap; }\n  table.spec td code { font-size: 11.5px; }\n  .num-col td:first-child { font-family: var(--mono); color: var(--t-blue); font-weight: 500; }\n\n  /* ---- Token swatches ---- */\n  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0 22px; }\n  .sw { border: 1px solid var(--hair); border-radius: 10px; overflow: hidden; }\n  .sw-chip { height: 56px; }\n  .sw-meta { padding: 8px 10px; }\n  .sw-meta b { display: block; font-size: 12px; font-weight: 700; }\n  .sw-meta code { background: none; padding: 0; font-size: 11px; color: var(--ink-3); }\n  @media (max-width: 540px) { .swatches { grid-template-columns: repeat(2, 1fr); } .cover-meta div { flex-basis: 50%; } }\n\n  /* type scale demo */\n  .typerow { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--hair); }\n  .typerow .tag { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }\n  .typerow .sz { color: var(--ink); font-weight: 700; letter-spacing: -.02em; line-height: 1; }\n\n  .pillrow { display: flex; flex-wrap: wrap; gap: 7px; margin: 6px 0 16px; }\n  .pill { font-family: var(--mono); font-size: 11px; padding: 4px 10px; border-radius: 999px; background: #EEF1F5; color: #3a3f47; border: 1px solid var(--hair); }\n\n  .toc { columns: 2; column-gap: 36px; font-size: 14px; margin-top: 8px; }\n  .toc a { display: block; padding: 5px 0; color: var(--ink-2); border-bottom: 1px solid var(--hair); }\n  .toc a b { font-family: var(--mono); color: var(--t-blue); font-size: 12px; margin-right: 8px; }\n  @media (max-width: 540px) { .toc { columns: 1; } }\n\n  .anatomy { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0 4px; }\n  .anatomy > div { border: 1px solid var(--hair); border-radius: 10px; padding: 14px 16px; background: var(--paper-2); }\n  .anatomy h5 { font-size: 13px; margin: 0 0 6px; font-weight: 700; }\n  .anatomy p { font-size: 13px; margin: 0; color: var(--ink-2); }\n  @media (max-width: 540px) { .anatomy { grid-template-columns: 1fr; } }\n\n  @page { size: letter; margin: 0; }\n  @media print {\n    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }\n    html, body { margin: 0; padding: 0; background: #fff; }\n    .doc { max-width: none !important; margin: 0 !important; padding: 0 0.6in !important; box-shadow: none !important; }\n    .hdr-space, .ftr-space { display: table-cell; height: 0.6in; }\n    h1, h2, h3, h4, h5 { break-after: avoid; }\n    .prompt, .note, .warn, .keep, table.spec tr, .sw, figure, .anatomy > div { break-inside: avoid; }\n    .section { break-inside: auto; }\n    p, li { orphans: 3; widows: 3; }\n    .screen-only { display: none !important; }\n  }\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n<main class=\"doc\">\n<table class=\"doc-frame\" role=\"presentation\">\n<thead><tr><td class=\"hdr-space\"><\u002Ftd><\u002Ftr><\u002Fthead>\n<tbody><tr><td>\n\n<!-- ============ COVER ============ -->\n<header class=\"cover\">\n  <div class=\"cover-brand\">\n    <span class=\"cover-dot\"><\u002Fspan>\n    <b>SeeTusk Creative Agency<\u002Fb>\n    <span>Pune · India<\u002Fspan>\n  <\u002Fdiv>\n  <h1>Website Redesign <span class=\"g\">Handover &amp; Build Brief<\u002Fspan><\u002Fh1>\n  <p class=\"cover-sub\">A complete, build-ready specification for regenerating the SeeTusk site in Lovable. New dark visual system, new section hierarchy, approved copy, and ready-to-paste prompts for every page.<\u002Fp>\n  <dl class=\"cover-meta\">\n    <div><dt>Prepared for<\u002Fdt><dd>Lovable (wireframe + UI)<\u002Fdd><\u002Fdiv>\n    <div><dt>Product<\u002Fdt><dd>seetusk.agency<\u002Fdd><\u002Fdiv>\n    <div><dt>Scope<\u002Fdt><dd>5 page types, full UI<\u002Fdd><\u002Fdiv>\n    <div><dt>Version<\u002Fdt><dd>v1.0 · Jun 2026<\u002Fdd><\u002Fdiv>\n  <\u002Fdl>\n<\u002Fheader>\n\n<!-- ============ HOW TO USE ============ -->\n<section class=\"section\">\n  <div class=\"kicker\">00 · How to use this document<\u002Fdiv>\n  <h2>Read it top to bottom. Build it in the same order.<\u002Fh2>\n  <p class=\"lead\">This brief is structured to be fed into Lovable in sequence. Each part builds on the one before it, so the design system is locked before any page is generated.<\u002Fp>\n\n  <ol>\n    <li><strong>Start with the Master Prompt<\u002Fstrong> (§02). Paste it first to seed the project: it sets the brand, the dark design system, the stack, and the global rules Lovable should apply to everything.<\u002Fli>\n    <li><strong>Lock the Design System<\u002Fstrong> (§03). Paste the tokens prompt so colors, type, spacing, and components exist as reusable styles before any page is built.<\u002Fli>\n    <li><strong>Generate pages one at a time<\u002Fstrong> (§05+). Each page has its own paste block. Build Home first, then About, Careers, the three service pages, and Contact. Generating one page per prompt keeps Lovable focused and the output consistent.<\u002Fli>\n    <li><strong>Apply the sitewide checklist<\u002Fstrong> (§06) as a final pass: navigation, CTAs, SEO, accessibility, responsive behavior.<\u002Fli>\n  <\u002Fol>\n\n  <div class=\"note\">\n    <span class=\"lbl\">How to read the blocks<\u002Fspan>\n    <p>Dark blocks marked <strong>⌘ PASTE INTO LOVABLE<\u002Fstrong> are written to be copied verbatim into the Lovable chat. Everything outside them is context for you, the human. <span class=\"hl\">Yellow<\u002Fspan> and <b>cyan<\u002Fb> highlights inside blocks mark values you may want to confirm before pasting.<\u002Fp>\n  <\u002Fdiv>\n\n  <h3>Table of contents<\u002Fh3>\n  <nav class=\"toc\">\n    <a href=\"#at-a-glance\"><b>01<\u002Fb> Project at a glance<\u002Fa>\n    <a href=\"#master\"><b>02<\u002Fb> Master prompt<\u002Fa>\n    <a href=\"#system\"><b>03<\u002Fb> Design system (dark)<\u002Fa>\n    <a href=\"#globals\"><b>04<\u002Fb> Global shells &amp; components<\u002Fa>\n    <a href=\"#home\"><b>05<\u002Fb> Home page<\u002Fa>\n    <a href=\"#about\"><b>06<\u002Fb> About page<\u002Fa>\n    <a href=\"#careers\"><b>07<\u002Fb> Careers page<\u002Fa>\n    <a href=\"#services\"><b>08<\u002Fb> Service pages (×3)<\u002Fa>\n    <a href=\"#campaigns\"><b>09<\u002Fb> Campaign Launches<\u002Fa>\n    <a href=\"#contact\"><b>10<\u002Fb> Contact page<\u002Fa>\n    <a href=\"#sitewide\"><b>11<\u002Fb> Sitewide requirements<\u002Fa>\n    <a href=\"#assets\"><b>12<\u002Fb> Asset inventory<\u002Fa>\n  <\u002Fnav>\n<\u002Fsection>\n\n<!-- ============ 01 AT A GLANCE ============ -->\n<section class=\"section\" id=\"at-a-glance\">\n  <div class=\"kicker\">01 · Project at a glance<\u002Fdiv>\n  <h2>What SeeTusk is, and what we are changing.<\u002Fh2>\n\n  <h3>The studio<\u002Fh3>\n  <p>SeeTusk Creative Agency (SCA) is a Pune-based <strong>creative distribution studio<\u002Fstrong>. It does three things and ties them together: makes the content, runs the creator campaigns, and builds the websites and tools that turn attention into customers, all shipped on a weekly rhythm.<\u002Fp>\n\n  <p><strong>Sitewide one-liner (use verbatim, everywhere):<\u002Fstrong><\u002Fp>\n  <div class=\"keep\">\n    <span class=\"lbl\">Approved positioning line<\u002Fspan>\n    <p>\"SeeTusk helps growing Indian brands get seen and chosen through content, creator campaigns, and websites that convert.\"<\u002Fp>\n  <\u002Fdiv>\n\n  <h3>Audience<\u002Fh3>\n  <p>Founders and marketing leads at growing Indian brands (D2C, FMCG, HoReCa, real estate, tech/SaaS, education). Cold visitors who must understand the offer within the first screen, plus talent visiting Careers.<\u002Fp>\n\n  <h3>What changes in this redesign<\u002Fh3>\n  <table class=\"spec\">\n    <thead><tr><th>Dimension<\u002Fth><th>Current live site<\u002Fth><th>This redesign<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>Visual mood<\u002Ftd><td>Light cream paper, warm<\u002Ftd><td>Dark, technical, premium (#0B0B0D base)<\u002Ftd><\u002Ftr>\n      <tr><td>Type<\u002Ftd><td>League Spartan + EB Garamond (serif body)<\u002Ftd><td>Single sans family: Satoshi / General Sans<\u002Ftd><\u002Ftr>\n      <tr><td>Accents<\u002Ftd><td>Blue + orange + yellow<\u002Ftd><td>Blue → purple → cyan gradient family<\u002Ftd><\u002Ftr>\n      <tr><td>Hierarchy<\u002Ftd><td>Long single scroll, founders mid-page<\u002Ftd><td>Offer-first, proof-first sitemap (see §05)<\u002Ftd><\u002Ftr>\n      <tr><td>4th service<\u002Ftd><td>\"Campaigns\" links to Contact, no page<\u002Ftd><td>Real destination for Campaign Launches<\u002Ftd><\u002Ftr>\n      <tr><td>Case studies<\u002Ftd><td>\"View case\" points to service pages<\u002Ftd><td>Real case detail (page or drawer)<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <div class=\"keep\">\n    <span class=\"lbl\">Keep — the brand signature<\u002Fspan>\n    <p>The hero concept stays: <strong>\"OWN. BUILD. RENT. DISTRIBUTION FOR AMBITIOUS BRANDS.\"<\u002Fstrong> It is distinctive and worth keeping. The plain support line beneath it carries the literal meaning for cold visitors.<\u002Fp>\n  <\u002Fdiv>\n\n  <h3>Primary goals for the rebuild<\u002Fh3>\n  <ul>\n    <li>A first-time visitor understands what SeeTusk does, who it serves, and where to go next within the first screen.<\u002Fli>\n    <li>All four service paths are visible above the fold and every one is reachable.<\u002Fli>\n    <li>Proof (results, cases, testimonials) comes before team detail.<\u002Fli>\n    <li>Every CTA opens a real, intent-matched destination.<\u002Fli>\n    <li>Motion-rich but accessible: reduced-motion support, visible focus, strong contrast on the dark base.<\u002Fli>\n  <\u002Ful>\n<\u002Fsection>\n\n<!-- ============ 02 MASTER PROMPT ============ -->\n<section class=\"section\" id=\"master\">\n  <div class=\"kicker\">02 · Master prompt<\u002Fdiv>\n  <h2>Seed the project with this first.<\u002Fh2>\n  <p class=\"lead\">Paste this once at the start of a fresh Lovable project. It establishes the brand, the dark design language, the stack, and the global rules that every later prompt assumes.<\u002Fp>\n\n  <div class=\"prompt\">Build a marketing website for <b>SeeTusk Creative Agency (SCA)<\u002Fb>, a Pune-based creative distribution studio that makes content, runs creator campaigns, and builds websites for growing Indian brands.\n\nPOSITIONING (use this exact line on the site):\n\"SeeTusk helps growing Indian brands get seen and chosen through content, creator campaigns, and websites that convert.\"\n\nVISUAL LANGUAGE — dark, technical, premium:\n• Backgrounds: primary <b>#0B0B0D<\u002Fb>, secondary <b>#111214<\u002Fb>, cards <b>#1B1D20<\u002Fb>.\n• Text: primary <b>#FFFFFF<\u002Fb>, secondary <b>#B7BDC6<\u002Fb>, muted <b>#80858D<\u002Fb>.\n• Accents: primary <b>#4F8CFF<\u002Fb> (CTAs + highlights), secondary <b>#7A5FFF<\u002Fb>, highlight <b>#58D5FF<\u002Fb>.\n• Signature gradient: <b>#4F8CFF → #7A5FFF<\u002Fb> (add #58D5FF for buttons). Use glow sparingly (blue, ~20% opacity).\n• Typeface: a single family, <b>Satoshi<\u002Fb> (fall back to General Sans / Inter). No serif.\n\nLAYOUT RULES (apply globally):\n• Max content width 1280px; paragraph reading width 760–820px.\n• 12-column grid desktop, 8 on tablet, 4 on mobile.\n• Section vertical padding 120px desktop / 80 tablet / 64 mobile. Side padding 32 / 24 / 20.\n• Cards: radius 20px, padding 32px, 1px border rgba(255,255,255,0.08), hover lift + soft shadow.\n• Buttons: height 52px, radius 12px; filled / outline / text variants; 200ms hover.\n• Every section follows the order: small label → H2 → description → content → CTA.\n\nMOTION: page-load fade-up 0.6s, card hover scale to 1.03, button hover 200ms, headline text reveal 40ms stagger. Always respect prefers-reduced-motion.\n\nSTACK: React + Tailwind, responsive, accessible (WCAG AA), semantic HTML, visible keyboard focus.\n\nDo not build any pages yet. First set up the design tokens and shared components. I will give you the tokens, then each page, one at a time.<\u002Fdiv>\n\n  <div class=\"note\">\n    <span class=\"lbl\">Why first, and alone<\u002Fspan>\n    <p>Seeding the system before any page keeps every later screen consistent. Resist letting Lovable generate pages from this prompt; the next section locks the tokens as reusable styles.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 03 DESIGN SYSTEM ============ -->\n<section class=\"section\" id=\"system\">\n  <div class=\"kicker\">03 · Design system (dark)<\u002Fdiv>\n  <h2>The tokens. Lock these before any page.<\u002Fh2>\n  <p class=\"lead\">Every value below comes straight from the SeeTusk Design System Standards. Build these as reusable design tokens / Tailwind theme values so each page references them rather than inventing new ones.<\u002Fp>\n\n  <h3>Color<\u002Fh3>\n  <div class=\"swatches\">\n    <div class=\"sw\"><div class=\"sw-chip\" style=\"background:#0B0B0D\"><\u002Fdiv><div class=\"sw-meta\"><b>Background<\u002Fb><code>#0B0B0D<\u002Fcode><\u002Fdiv><\u002Fdiv>\n    <div class=\"sw\"><div class=\"sw-chip\" style=\"background:#111214\"><\u002Fdiv><div class=\"sw-meta\"><b>Surface 2<\u002Fb><code>#111214<\u002Fcode><\u002Fdiv><\u002Fdiv>\n    <div class=\"sw\"><div class=\"sw-chip\" style=\"background:#1B1D20\"><\u002Fdiv><div class=\"sw-meta\"><b>Card<\u002Fb><code>#1B1D20<\u002Fcode><\u002Fdiv><\u002Fdiv>\n    <div class=\"sw\"><div class=\"sw-chip\" style=\"background:#FFFFFF;border-bottom:1px solid #E4E7EC\"><\u002Fdiv><div class=\"sw-meta\"><b>Text primary<\u002Fb><code>#FFFFFF<\u002Fcode><\u002Fdiv><\u002Fdiv>\n    <div class=\"sw\"><div class=\"sw-chip\" style=\"background:#B7BDC6\"><\u002Fdiv><div class=\"sw-meta\"><b>Text secondary<\u002Fb><code>#B7BDC6<\u002Fcode><\u002Fdiv><\u002Fdiv>\n    <div class=\"sw\"><div class=\"sw-chip\" style=\"background:#80858D\"><\u002Fdiv><div class=\"sw-meta\"><b>Text muted<\u002Fb><code>#80858D<\u002Fcode><\u002Fdiv><\u002Fdiv>\n    <div class=\"sw\"><div class=\"sw-chip\" style=\"background:#4F8CFF\"><\u002Fdiv><div class=\"sw-meta\"><b>Accent / CTA<\u002Fb><code>#4F8CFF<\u002Fcode><\u002Fdiv><\u002Fdiv>\n    <div class=\"sw\"><div class=\"sw-chip\" style=\"background:#7A5FFF\"><\u002Fdiv><div class=\"sw-meta\"><b>Accent 2<\u002Fb><code>#7A5FFF<\u002Fcode><\u002Fdiv><\u002Fdiv>\n    <div class=\"sw\"><div class=\"sw-chip\" style=\"background:#58D5FF\"><\u002Fdiv><div class=\"sw-meta\"><b>Highlight<\u002Fb><code>#58D5FF<\u002Fcode><\u002Fdiv><\u002Fdiv>\n    <div class=\"sw\"><div class=\"sw-chip\" style=\"background:linear-gradient(135deg,#0B0B0D,#15171A)\"><\u002Fdiv><div class=\"sw-meta\"><b>Hero bg<\u002Fb><code>#0B0B0D→#15171A<\u002Fcode><\u002Fdiv><\u002Fdiv>\n    <div class=\"sw\"><div class=\"sw-chip\" style=\"background:linear-gradient(135deg,#4F8CFF,#7A5FFF)\"><\u002Fdiv><div class=\"sw-meta\"><b>Accent grad<\u002Fb><code>blue→purple<\u002Fcode><\u002Fdiv><\u002Fdiv>\n    <div class=\"sw\"><div class=\"sw-chip\" style=\"background:linear-gradient(135deg,#4F8CFF,#58D5FF)\"><\u002Fdiv><div class=\"sw-meta\"><b>Button grad<\u002Fb><code>blue→cyan<\u002Fcode><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3>Typography — single family, Satoshi<\u002Fh3>\n  <p>One typeface across the whole site. Sizes are desktop / tablet / mobile.<\u002Fp>\n  <div style=\"border-top:1px solid var(--hair);margin:8px 0 18px\">\n    <div class=\"typerow\"><span class=\"tag\">Hero H1<br>Bold<\u002Fspan><span class=\"sz\" style=\"font-size:40px\">72 / 60 / 42 px<\u002Fspan><\u002Fdiv>\n    <div class=\"typerow\"><span class=\"tag\">Hero desc<br>max 700px<\u002Fspan><span class=\"sz\" style=\"font-size:21px;font-weight:500\">22 / 20 / 18 px<\u002Fspan><\u002Fdiv>\n    <div class=\"typerow\"><span class=\"tag\">H2<br>section<\u002Fspan><span class=\"sz\" style=\"font-size:30px\">48 / 40 / 32 px<\u002Fspan><\u002Fdiv>\n    <div class=\"typerow\"><span class=\"tag\">H3<br>subsection<\u002Fspan><span class=\"sz\" style=\"font-size:22px\">28 / 24 / 22 px<\u002Fspan><\u002Fdiv>\n    <div class=\"typerow\"><span class=\"tag\">H4<br>card title<\u002Fspan><span class=\"sz\" style=\"font-size:18px\">24 / 22 / 20 px<\u002Fspan><\u002Fdiv>\n    <div class=\"typerow\"><span class=\"tag\">Body<\u002Fspan><span class=\"sz\" style=\"font-size:18px;font-weight:400\">18 / 17 / 16 px<\u002Fspan><\u002Fdiv>\n    <div class=\"typerow\"><span class=\"tag\">Small<br>captions<\u002Fspan><span class=\"sz\" style=\"font-size:15px;font-weight:400\">16 / 15 / 14 px<\u002Fspan><\u002Fdiv>\n    <div class=\"typerow\"><span class=\"tag\">Labels<br>UPPERCASE<\u002Fspan><span class=\"sz\" style=\"font-size:13px;font-weight:500;letter-spacing:.1em;font-family:var(--mono)\">14 / 14 / 13 px<\u002Fspan><\u002Fdiv>\n    <div class=\"typerow\"><span class=\"tag\">Button<br>medium<\u002Fspan><span class=\"sz\" style=\"font-size:16px;font-weight:500\">16 / 16 / 15 px<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3>Layout &amp; spacing<\u002Fh3>\n  <table class=\"spec\">\n    <thead><tr><th>Token<\u002Fth><th>Desktop<\u002Fth><th>Tablet<\u002Fth><th>Mobile<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>Max container width<\u002Ftd><td>1280px<\u002Ftd><td>100%<\u002Ftd><td>100%<\u002Ftd><\u002Ftr>\n      <tr><td>Reading width (paragraphs)<\u002Ftd><td>760–820px<\u002Ftd><td>100%<\u002Ftd><td>100%<\u002Ftd><\u002Ftr>\n      <tr><td>Grid columns<\u002Ftd><td>12<\u002Ftd><td>8<\u002Ftd><td>4<\u002Ftd><\u002Ftr>\n      <tr><td>Section padding (top &amp; bottom)<\u002Ftd><td>120px<\u002Ftd><td>80px<\u002Ftd><td>64px<\u002Ftd><\u002Ftr>\n      <tr><td>Side padding<\u002Ftd><td>32px<\u002Ftd><td>24px<\u002Ftd><td>20px<\u002Ftd><\u002Ftr>\n      <tr><td>Heading → paragraph<\u002Ftd><td>24px<\u002Ftd><td>20px<\u002Ftd><td>16px<\u002Ftd><\u002Ftr>\n      <tr><td>Paragraph → CTA<\u002Ftd><td>32px<\u002Ftd><td>24px<\u002Ftd><td>20px<\u002Ftd><\u002Ftr>\n      <tr><td>Card gap / Section gap<\u002Ftd><td>24 / 120px<\u002Ftd><td>20 / 80px<\u002Ftd><td>16 / 64px<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <div class=\"pillrow\">\n    <span class=\"pill\">Breakpoint desktop ≥1440px<\u002Fspan>\n    <span class=\"pill\">tablet 768–1023px<\u002Fspan>\n    <span class=\"pill\">mobile ≤767px<\u002Fspan>\n  <\u002Fdiv>\n\n  <h3>Components<\u002Fh3>\n  <table class=\"spec\">\n    <thead><tr><th>Component<\u002Fth><th>Spec<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>Buttons<\u002Ftd><td>Height 52 / 48 / 44px · radius 12 / 12 / 10px · variants Filled, Outline, Text · filled uses blue→cyan gradient · 200ms hover.<\u002Ftd><\u002Ftr>\n      <tr><td>Cards<\u002Ftd><td>Radius 20 / 18 / 16px · padding 32 / 24 / 20px · 1px border <code>rgba(255,255,255,0.08)<\u002Fcode> · hover = lift + soft shadow + scale 1.03.<\u002Ftd><\u002Ftr>\n      <tr><td>Images<\u002Ftd><td>Radius 20 / 18 / 16px · consistent aspect ratio · soft shadow.<\u002Ftd><\u002Ftr>\n      <tr><td>Icons<\u002Ftd><td>Outline style only · 2px stroke · one icon family throughout.<\u002Ftd><\u002Ftr>\n      <tr><td>FAQ<\u002Ftd><td>Accordion, one consistent style. Native <code>&lt;details&gt;<\u002Fcode> is fine.<\u002Ftd><\u002Ftr>\n      <tr><td>Inputs<\u002Ftd><td>Dark fields on <code>#111214<\u002Fcode>, 1px subtle border, blue focus ring, visible label.<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <h3>Motion<\u002Fh3>\n  <div class=\"pillrow\">\n    <span class=\"pill\">Page load · fade up 0.6s<\u002Fspan>\n    <span class=\"pill\">Card hover · scale 1 → 1.03<\u002Fspan>\n    <span class=\"pill\">Button hover · 200ms<\u002Fspan>\n    <span class=\"pill\">Text reveal · 40ms stagger<\u002Fspan>\n    <span class=\"pill\">Glow · blue 20% opacity, minimal<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"warn\">\n    <span class=\"lbl\">Non-negotiable<\u002Fspan>\n    <p>The brand is motion-heavy, so accessibility matters most here. Honor <code>prefers-reduced-motion<\u002Fcode> on the hero, any marquee/ticker, and all scroll animation. Keep visible keyboard focus on every interactive element. Maintain AA contrast for grey-on-dark body text and small uppercase labels.<\u002Fp>\n  <\u002Fdiv>\n\n  <p class=\"prompt-label\">Paste after the master prompt:<\u002Fp>\n  <div class=\"prompt\">Set up the design system as reusable tokens / Tailwind theme before building pages.\n\nCOLORS — bg #0B0B0D, surface #111214, card #1B1D20; text #FFFFFF / #B7BDC6 / #80858D; accent #4F8CFF, accent-2 #7A5FFF, highlight #58D5FF. Gradients: hero #0B0B0D→#15171A, accent #4F8CFF→#7A5FFF, button #4F8CFF→#58D5FF.\n\nTYPE — Satoshi (fallback General Sans / Inter), single family. Scale (desktop/tablet/mobile): H1 72/60/42 bold; hero desc 22/20/18 (max-width 700px); H2 48/40/32; H3 28/24/22; H4 24/22/20; body 18/17/16; small 16/15/14; label 14/14/13 uppercase letter-spaced; button 16/16/15 medium.\n\nLAYOUT — max 1280px container, 760–820px reading width, 12/8/4 grid, section padding 120/80/64, side padding 32/24/20, card gap 24/20/16.\n\nCOMPONENTS — Button: 52/48/44 height, 12/12/10 radius, Filled (blue→cyan) / Outline / Text, 200ms hover. Card: 20/18/16 radius, 32/24/20 padding, 1px rgba(255,255,255,0.08) border, hover lift+shadow+scale 1.03. Images: 20/18/16 radius, soft shadow. Icons: outline, 2px stroke. FAQ accordion. Inputs: dark, blue focus ring.\n\nMOTION — fade-up 0.6s on load, card hover scale 1.03, button 200ms, text reveal 40ms stagger, minimal blue glow at 20%. Respect prefers-reduced-motion. Visible focus everywhere; WCAG AA contrast.\n\nConfirm the tokens and base components (Button, Card, SectionHeading, Input, Accordion, Nav, Footer) exist, then wait for page prompts.<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 04 GLOBALS ============ -->\n<section class=\"section\" id=\"globals\">\n  <div class=\"kicker\">04 · Global shells &amp; components<\u002Fdiv>\n  <h2>Patterns every page reuses.<\u002Fh2>\n\n  <h3>Navigation (identical on every page)<\u002Fh3>\n  <p>Client-focused top nav. Keep it the same across all pages. Careers and Contact live in the footer, not the top nav.<\u002Fp>\n  <div class=\"anatomy\">\n    <div><h5>Top nav<\u002Fh5><p>Logo (SeeTusk / SCA) left. Links: <strong>Content · Creators · Web &amp; Tech · About<\u002Fstrong>. Primary \"Start a project\" button right (filled gradient). Sticky, glassy on the dark base, blur backdrop.<\u002Fp><\u002Fdiv>\n    <div><h5>Mobile nav<\u002Fh5><p>Hamburger → full-screen overlay, large stacked links, gradient CTA at the bottom. Visible focus, trap focus while open.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"note\"><span class=\"lbl\">Heading accessibility<\u002Fspan><p>Do not split headings letter-by-letter in the DOM (the stacked \"Seetusk / Creative / Agency\" wordmark and the kinetic hero). The accessible name must read as whole words for screen readers and crawlers, even if the visual animates per letter.<\u002Fp><\u002Fdiv>\n\n  <h3>Section scaffold (use for nearly every section)<\u002Fh3>\n  <div class=\"anatomy\">\n    <div><h5>Order<\u002Fh5><p>Small numbered/uppercase label → H2 → one-line description → content → optional CTA. This is the standard rhythm; keep it consistent.<\u002Fp><\u002Fdiv>\n    <div><h5>Section number motif<\u002Fh5><p>Keep the \"001 / 002 / 003\" monospace section counters as an accent in the muted/blue color. They give the technical, editorial feel.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3>Footer (every page)<\u002Fh3>\n  <p>Dark footer with: brand block + the footer description below, link columns (Verticals / Studio / Elsewhere), social icons (YouTube, X, Instagram, LinkedIn), and the newsletter signup. <strong>Newsletter lives in the footer only<\u002Fstrong>, never stacked against the final CTA.<\u002Fp>\n  <div class=\"keep\"><span class=\"lbl\">Footer description — use verbatim<\u002Fspan><p>\"SeeTusk Creative Agency is a Pune-based creative distribution studio. We build content, creator campaigns, web surfaces and launch systems for ambitious Indian brands.\"<\u002Fp><\u002Fdiv>\n\n  <p class=\"prompt-label\">Reusable shell prompt:<\u002Fp>\n  <div class=\"prompt\">Build the shared NAV and FOOTER used on every page.\n\nNAV (sticky, glassy blur over the dark bg): logo \"SeeTusk / SCA\" left; links <b>Content · Creators · Web &amp; Tech · About<\u002Fb>; a filled gradient \"Start a project\" button right linking to /contact. Mobile = hamburger opening a full-screen overlay with large stacked links and the CTA at the bottom. Keyboard accessible, focus trapped when open. Heading/wordmark must expose whole words to screen readers even if letters animate individually.\n\nFOOTER (dark): brand mark + description \"SeeTusk Creative Agency is a Pune-based creative distribution studio. We build content, creator campaigns, web surfaces and launch systems for ambitious Indian brands.\" Link columns — Verticals: Content, Creators, Web &amp; Tech · Studio: About, Contact, Careers · Elsewhere: contact@seetusk.com, hr@seetusk.com, LinkedIn, Instagram. Social icons: YouTube, X, Instagram, LinkedIn (outline). Newsletter signup block (\"Read what we ship\" — weekly newsletter, email + Subscribe) lives ONLY here, with visible success and error states. Bottom row: \"© 2026 SeeTusk Creative Agency / Pune, IND\" and \"seetusk.agency / Built in-house\".<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 05 HOME ============ -->\n<section class=\"section\" id=\"home\">\n  <div class=\"kicker\">05 · Home page · /<\u002Fdiv>\n  <h2>Home — explain the whole offer, fast.<\u002Fh2>\n  <p class=\"lead\"><strong>Goal:<\u002Fstrong> a first-time visitor understands what SeeTusk does, who it serves, why it is credible, and which service path to take next, ideally within the first screen. 15 sections, offer-first and proof-first.<\u002Fp>\n\n  <table class=\"spec num-col\">\n    <thead><tr><th>#<\u002Fth><th>Section<\u002Fth><th>Layout &amp; content<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>01<\u002Ftd><td>Hero<\u002Ftd><td>Left-aligned text (650–700px) + visual right. Order: label → H1 → description → CTA → trust bar. Keep \"OWN. BUILD. RENT. DISTRIBUTION FOR AMBITIOUS BRANDS.\" as H1 with kinetic reveal; plain support line beneath.<\u002Ftd><\u002Ftr>\n      <tr><td>02<\u002Ftd><td>We help with<\u002Ftd><td>Compact horizontal strip directly under the hero. Four labels: Content · Creator Campaigns · Web &amp; Tech · Campaign Launches. Full offer visible without scrolling.<\u002Ftd><\u002Ftr>\n      <tr><td>03<\u002Ftd><td>Client trust<\u002Ftd><td>Logo wall / marquee of client logos. Second (duplicate) marquee copy is decorative → <code>aria-hidden<\u002Fcode>, empty alt.<\u002Ftd><\u002Ftr>\n      <tr><td>04<\u002Ftd><td>Services<\u002Ftd><td>Four service cards, grid. Each = number, name, one-line value, link to its page. Single link per card.<\u002Ftd><\u002Ftr>\n      <tr><td>05<\u002Ftd><td>Results<\u002Ftd><td>Dark stat band. Four big numbers: 12M+ views · 150+ assets shipped · 40+ shoot days · 25+ brands.<\u002Ftd><\u002Ftr>\n      <tr><td>06<\u002Ftd><td>Case studies<\u002Ftd><td>Four case cards (Ambar Coffee, FIRVT, DevKnight, Fevistik). \"View case\" → real case detail (page or drawer), not the service page.<\u002Ftd><\u002Ftr>\n      <tr><td>07<\u002Ftd><td>Industries<\u002Ftd><td>Six category cards: D2C &amp; E-com, FMCG, HoReCa, Real estate, Tech &amp; SaaS, Education.<\u002Ftd><\u002Ftr>\n      <tr><td>08<\u002Ftd><td>Why SeeTusk<\u002Ftd><td>Two-column comparison (900px). \"Most agencies\" (×) vs \"SeeTusk\" (✓). Five rows each.<\u002Ftd><\u002Ftr>\n      <tr><td>09<\u002Ftd><td>Engagement models<\u002Ftd><td>Three cards: Launch (one-off) · Scale (3–6 mo sprint) · Retainer (monthly).<\u002Ftd><\u002Ftr>\n      <tr><td>10<\u002Ftd><td>Founders<\u002Ftd><td>Condensed team strip. Three founders, short bios. Sits below proof and offer.<\u002Ftd><\u002Ftr>\n      <tr><td>11<\u002Ftd><td>Testimonials<\u002Ftd><td>Three quote cards (900px), grid or carousel.<\u002Ftd><\u002Ftr>\n      <tr><td>12<\u002Ftd><td>FAQ<\u002Ftd><td>Accordion (800px, centered). Six questions.<\u002Ftd><\u002Ftr>\n      <tr><td>13<\u002Ftd><td>Final CTA<\u002Ftd><td>Centered CTA card (700px). \"Start a project\" + \"See the work\" (anchors to case studies).<\u002Ftd><\u002Ftr>\n      <tr><td>14<\u002Ftd><td>Newsletter<\u002Ftd><td>Footer only — do not place a second block here.<\u002Ftd><\u002Ftr>\n      <tr><td>15<\u002Ftd><td>Footer<\u002Ftd><td>Shared footer (§04).<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <h3>Approved copy — Home<\u002Fh3>\n  <div class=\"keep\">\n    <span class=\"lbl\">Copy bank · use verbatim<\u002Fspan>\n    <p><strong>Hero support line:<\u002Fstrong> \"We help growing Indian brands get seen and chosen through content, creator campaigns, and websites that convert.\"<\u002Fp>\n    <p><strong>Service intro:<\u002Fstrong> \"Pick the part of the growth loop you need fixed: your content, your creator distribution, your website, or a launch that needs to travel.\"<\u002Fp>\n    <p><strong>Case study CTA:<\u002Fstrong> \"See exactly what we shipped, what changed, and what we would do differently next time.\"<\u002Fp>\n    <p><strong>Service card · Content and Brand:<\u002Fstrong> \"We own your voice, content calendar, shoots, reels, statics and reporting so your brand shows up clearly every week.\"<\u002Fp>\n    <p><strong>Service card · Creator Campaigns:<\u002Fstrong> \"We source, brief, contract, track and report creators so you know which posts drove reach, clicks, orders and reusable assets.\"<\u002Fp>\n    <p><strong>Service card · Web and Tech:<\u002Fstrong> \"We write, design and build websites, landers, Shopify surfaces and lightweight tools that turn attention into leads or sales.\"<\u002Fp>\n    <p><strong>Service card · Campaign Launches:<\u002Fstrong> \"We shape the idea, visual world, shoot, creator layer and rollout plan for launches that need to travel fast.\"<\u002Fp>\n  <\u002Fdiv>\n\n  <p class=\"prompt-label\">Build Home with this:<\u002Fp>\n  <div class=\"prompt\">Build the HOME page (/) using the established dark design system, nav and footer. Sections in this order:\n\n1. HERO — left text (max 650px) + visual right. Label \"SCA / 2026 · Pune → Mumbai · India\". H1 (keep, large, kinetic per-letter reveal but whole-words for a11y): <hl>\"OWN. BUILD. RENT. DISTRIBUTION FOR AMBITIOUS BRANDS.\"<\u002Fhl> with \"DISTRIBUTION\" in the blue→purple gradient. Support line: \"We help growing Indian brands get seen and chosen through content, creator campaigns, and websites that convert.\" Primary CTA \"Start a project →\" to /contact. Small \"Now booking new retainers for Q3\" status with a live dot.\n\n2. WE HELP WITH — compact strip right under the hero: Content · Creator Campaigns · Web &amp; Tech · Campaign Launches. Visible without scrolling.\n\n3. CLIENT TRUST — auto-scrolling logo marquee; duplicate row aria-hidden + empty alt.\n\n4. SERVICES — 4 cards (label → H4 → one-line → link). Intro: \"Pick the part of the growth loop you need fixed: your content, your creator distribution, your website, or a launch that needs to travel.\" Cards: Content and Brand → /content; Creator Campaigns → /influencer; Web and Tech → /web; Campaign Launches → /campaigns (use the copy-bank lines). Each card is ONE link.\n\n5. RESULTS — dark stat band, 4 numbers: 12M+ views generated · 150+ campaign assets shipped · 40+ shoot days across India · 25+ brands served. H2 \"Numbers, not adjectives.\"\n\n6. CASE STUDIES — 4 cards: Ambar Coffee (F&amp;B/Content), FIRVT (Launch/Creators), DevKnight (Brand/Web), Fevistik (Campaign/OOH). CTA \"View case\" → real case detail page or drawer (problem, work, result, timeline, deliverables). CTA copy: \"See exactly what we shipped, what changed, and what we would do differently next time.\"\n\n7. INDUSTRIES — 6 cards: D2C &amp; E-com, FMCG, HoReCa, Real estate, Tech &amp; SaaS, Education.\n\n8. WHY SEETUSK — two-column comparison. \"Most agencies\" (×): account manager in between; billed for volume; strategy deck then silence; content/creators/web in 3 vendors; juniors execute. \"SeeTusk\" (✓, gradient card): the people in the room do the work; judged on outcomes not output; something ships every week in the open; content+creators+web under one roof; founders stay on every account.\n\n9. ENGAGEMENT MODELS — 3 cards: Launch (one sharp project, fixed scope) · Scale (3–6 month sprint) · Retainer (ongoing monthly distribution team).\n\n10. FOUNDERS — condensed strip, 3 founders (Sarthak, Saksham, Melbin), one-line bios. Below the proof.\n\n11. TESTIMONIALS — 3 quote cards: Ambar Coffee founder, FIRVT marketing lead, DevKnight founder.\n\n12. FAQ — accordion, 6 items (what SeeTusk does, how you charge, how fast you ship, only Pune?, can we start with one service, who does the work).\n\n13. FINAL CTA — centered card: \"Ready to build a brand people actually notice?\" buttons \"Start a project →\" (/contact) and \"See the work\" (anchor to case studies). NO newsletter here.\n\nFooter (shared) carries the newsletter. Every CTA must resolve to a real destination; respect reduced motion; visible focus; single-link cards.<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 06 ABOUT ============ -->\n<section class=\"section\" id=\"about\">\n  <div class=\"kicker\">06 · About page · /about<\u002Fdiv>\n  <h2>About — build trust after the offer is understood.<\u002Fh2>\n  <p class=\"lead\"><strong>Goal:<\u002Fstrong> explain why the studio is different and why this team can deliver. Visitors arrive already knowing the services. 11 sections.<\u002Fp>\n\n  <table class=\"spec num-col\">\n    <thead><tr><th>#<\u002Fth><th>Section<\u002Fth><th>Layout &amp; content<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>01<\u002Ftd><td>Hero<\u002Ftd><td>\"Who we are.\" Short, confident intro to the studio.<\u002Ftd><\u002Ftr>\n      <tr><td>02<\u002Ftd><td>How we started<\u002Ftd><td>Founding story. Founded late 2025, Bavdhan. The coffee-brand → waitlist → 14 people story. Keep its personality, avoid agency boilerplate.<\u002Ftd><\u002Ftr>\n      <tr><td>03<\u002Ftd><td>Our edge<\u002Ftd><td>The small-studio / no-layers differentiator.<\u002Ftd><\u002Ftr>\n      <tr><td>04<\u002Ftd><td>What we actually do<\u002Ftd><td>Short service strip linking to live service pages. Place near the top.<\u002Ftd><\u002Ftr>\n      <tr><td>05<\u002Ftd><td>Studio story<\u002Ftd><td>Growth journey narrative.<\u002Ftd><\u002Ftr>\n      <tr><td>06<\u002Ftd><td>Principles<\u002Ftd><td>Four cards, verbatim: Taste over volume · Write it down · Ship weekly · No vanity metrics.<\u002Ftd><\u002Ftr>\n      <tr><td>07<\u002Ftd><td>Founders<\u002Ftd><td>Expanded bios — role + a client-facing outcome (not just function). One or two sentences each.<\u002Ftd><\u002Ftr>\n      <tr><td>08<\u002Ftd><td>Operating model<\u002Ftd><td>Proof of how work happens: weekly cadence / reporting rhythm.<\u002Ftd><\u002Ftr>\n      <tr><td>09<\u002Ftd><td>Why clients stay<\u002Ftd><td>The working-relationship / retention story.<\u002Ftd><\u002Ftr>\n      <tr><td>10<\u002Ftd><td>Next move<\u002Ftd><td>Final CTA → Contact.<\u002Ftd><\u002Ftr>\n      <tr><td>11<\u002Ftd><td>Footer<\u002Ftd><td>Shared footer (§04).<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <div class=\"keep\">\n    <span class=\"lbl\">Copy bank · About (use verbatim where given)<\u002Fspan>\n    <p><strong>What we do strip:<\u002Fstrong> \"We help with: Content &amp; Brand · Creator Campaigns · Web &amp; Tech\"<\u002Fp>\n    <p><strong>Team intro:<\u002Fstrong> \"The founders stay close because strategy, production and web cannot be separated when the goal is distribution.\"<\u002Fp>\n    <p><strong>Founder outcome clauses<\u002Fstrong> — Sarthak: \"…then turns it into a voice and content strategy your team can actually run with.\" Saksham: \"…so traffic turns into leads, not bounce rate.\" Melbin: \"…on time, every week, without you chasing it.\"<\u002Fp>\n    <p><strong>Operating model line:<\u002Fstrong> \"What a client week looks like: Monday async update → Wednesday working session → Friday roadmap refresh.\"<\u002Fp>\n    <p><strong>Final CTA:<\u002Fstrong> \"Bring us the part of your brand engine that is stuck: content, creators, web, or a launch. We will give you a sharp read and a practical next step.\"<\u002Fp>\n    <p><strong>Principles (verbatim):<\u002Fstrong> Taste over volume · Write it down · Ship weekly · No vanity metrics.<\u002Fp>\n  <\u002Fdiv>\n\n  <p class=\"prompt-label\">Build About with this:<\u002Fp>\n  <div class=\"prompt\">Build the ABOUT page (/about) on the dark system with shared nav/footer. Sections:\n\n1. HERO \"Who we are\" — confident short intro to the studio.\n2. HOW WE STARTED — founding story: founded late 2025 in Bavdhan, started with a coffee brand, grew via a waitlist to 14 people. Keep personality, no agency boilerplate.\n3. OUR EDGE — the small-studio, no-layers differentiator.\n4. WHAT WE ACTUALLY DO — short strip near the top: \"We help with: Content &amp; Brand · Creator Campaigns · Web &amp; Tech\" linking to /content, /influencer, /web (4th item → /contact).\n5. STUDIO STORY — growth journey.\n6. PRINCIPLES — 4 cards verbatim: Taste over volume · Write it down · Ship weekly · No vanity metrics.\n7. FOUNDERS — Sarthak (content/voice strategy), Saksham (sites, landers, tools — \"so traffic turns into leads, not bounce rate\"), Melbin (\"on time, every week, without you chasing it\"). Each bio = role + client outcome, 1–2 sentences. Intro line above: \"The founders stay close because strategy, production and web cannot be separated when the goal is distribution.\"\n8. OPERATING MODEL — proof element: \"What a client week looks like: Monday async update → Wednesday working session → Friday roadmap refresh.\"\n9. WHY CLIENTS STAY — retention / working-relationship story.\n10. NEXT MOVE — CTA: \"Bring us the part of your brand engine that is stuck: content, creators, web, or a launch. We will give you a sharp read and a practical next step.\" → /contact.\n\nService clarity/proof stays above team detail. Real, useful alt text on team photos.<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 07 CAREERS ============ -->\n<section class=\"section\" id=\"careers\">\n  <div class=\"kicker\">07 · Careers page · /careers<\u002Fdiv>\n  <h2>Careers — recruit talent with a clear hiring path.<\u002Fh2>\n  <p class=\"lead\"><strong>Goal:<\u002Fstrong> a candidate understands the culture, open roles, and the application process without leaving the page. Reached from the footer. 11 sections.<\u002Fp>\n\n  <table class=\"spec num-col\">\n    <thead><tr><th>#<\u002Fth><th>Section<\u002Fth><th>Layout &amp; content<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>01<\u002Ftd><td>Hero<\u002Ftd><td>\"Work at SeeTusk.\" Recruit-focused headline + CTA to open roles / apply.<\u002Ftd><\u002Ftr>\n      <tr><td>02<\u002Ftd><td>Studio culture<\u002Ftd><td>Mission &amp; values. Sets expectations. Reuse the four Principles tone.<\u002Ftd><\u002Ftr>\n      <tr><td>03<\u002Ftd><td>Open roles<\u002Ftd><td>Role cards (SSR-style). Each: title, type, short summary, Apply link.<\u002Ftd><\u002Ftr>\n      <tr><td>04<\u002Ftd><td>Hiring process<\u002Ftd><td>5-step timeline: Apply → Review → Conversation → Paid Trial → Offer.<\u002Ftd><\u002Ftr>\n      <tr><td>05<\u002Ftd><td>How we work<\u002Ftd><td>Team workflow / weekly cadence, mirroring the operating model.<\u002Ftd><\u002Ftr>\n      <tr><td>06<\u002Ftd><td>Benefits<\u002Ftd><td>Growth &amp; ownership value proposition cards.<\u002Ftd><\u002Ftr>\n      <tr><td>07<\u002Ftd><td>Role expectations<\u002Ftd><td>Responsibilities / what good looks like.<\u002Ftd><\u002Ftr>\n      <tr><td>08<\u002Ftd><td>FAQ<\u002Ftd><td>Hiring questions accordion.<\u002Ftd><\u002Ftr>\n      <tr><td>09<\u002Ftd><td>Apply<\u002Ftd><td>Application form — primary conversion. Connect to the existing apply endpoint.<\u002Ftd><\u002Ftr>\n      <tr><td>10<\u002Ftd><td>Confirmation<\u002Ftd><td>Submission success state + next steps.<\u002Ftd><\u002Ftr>\n      <tr><td>11<\u002Ftd><td>Footer<\u002Ftd><td>Shared footer (§04).<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <div class=\"note\"><span class=\"lbl\">Form<\u002Fspan><p>The repo already has an apply endpoint (<code>api/apply.js<\u002Fcode> + backend). Wire the form to it; show clear validation, a success confirmation state, and an error state. Application fields should map to the existing backend model.<\u002Fp><\u002Fdiv>\n\n  <p class=\"prompt-label\">Build Careers with this:<\u002Fp>\n  <div class=\"prompt\">Build the CAREERS page (/careers) on the dark system with shared nav/footer. Sections:\n\n1. HERO \"Work at SeeTusk\" — recruiting headline + CTA scrolling to roles / apply.\n2. STUDIO CULTURE — mission &amp; values; echo the studio principles (Taste over volume, Write it down, Ship weekly, No vanity metrics).\n3. OPEN ROLES — role cards: title, type (full-time/contract), 1–2 line summary, \"Apply\" link to the form.\n4. HIRING PROCESS — horizontal 5-step timeline: Apply → Review → Conversation → Paid Trial → Offer.\n5. HOW WE WORK — weekly team workflow.\n6. BENEFITS — cards on growth &amp; ownership.\n7. ROLE EXPECTATIONS — responsibilities / what good looks like.\n8. FAQ — hiring questions accordion.\n9. APPLY — application form (name, email, role, portfolio/links, message, optional file). Connect to the existing apply endpoint; show validation, success confirmation, and error states.\n10. CONFIRMATION — success state with next steps after submit.\n\nKeep visible focus on all fields and the submit button; the form must be fully keyboard operable.<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 08 SERVICES ============ -->\n<section class=\"section\" id=\"services\">\n  <div class=\"kicker\">08 · Service pages · /content · /influencer · /web<\u002Fdiv>\n  <h2>Service pages — one shared template, three flavors.<\u002Fh2>\n  <p class=\"lead\">Each vertical page sells one service in depth and converts to Contact. Build one template, then change the copy, accent emphasis, and examples per page. Use one service vocabulary everywhere: <strong>Content and Brand · Creator Campaigns · Web and Tech · Campaign Launches<\u002Fstrong>.<\u002Fp>\n\n  <h3>Shared service-page template<\u002Fh3>\n  <table class=\"spec num-col\">\n    <thead><tr><th>#<\u002Fth><th>Section<\u002Fth><th>Content<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>01<\u002Ftd><td>Hero<\u002Ftd><td>Service name, sharp value headline, support line, \"Start a project\" CTA, supporting visual.<\u002Ftd><\u002Ftr>\n      <tr><td>02<\u002Ftd><td>Problem<\u002Ftd><td>Centered (700px). The pain this service removes.<\u002Ftd><\u002Ftr>\n      <tr><td>03<\u002Ftd><td>The system<\u002Ftd><td>How we run it: timeline / numbered steps, full width.<\u002Ftd><\u002Ftr>\n      <tr><td>04<\u002Ftd><td>What we manage / deliver<\u002Ftd><td>Deliverables grid.<\u002Ftd><\u002Ftr>\n      <tr><td>05<\u002Ftd><td>Types / packages<\u002Ftd><td>Engagement or work-type cards.<\u002Ftd><\u002Ftr>\n      <tr><td>06<\u002Ftd><td>Proof<\u002Ftd><td>Tracking / results, plus relevant case examples.<\u002Ftd><\u002Ftr>\n      <tr><td>07<\u002Ftd><td>FAQ<\u002Ftd><td>Accordion, service-specific questions.<\u002Ftd><\u002Ftr>\n      <tr><td>08<\u002Ftd><td>Next move<\u002Ftd><td>Closing CTA → Contact (preselect this service).<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <div class=\"note\"><span class=\"lbl\">Trimmed in the last pass — confirm before re-adding<\u002Fspan><p>On Web, the \"Selected work\", \"Motion experiments\", and \"Handoff &amp; ownership\" sections were removed pending approved content. On Creators, \"Creator selection\" and \"Compliance and rights\" were removed. Do not regenerate these unless the content is approved; the audit wants no placeholder/unverified sections.<\u002Fp><\u002Fdiv>\n\n  <div class=\"anatomy\">\n    <div><h5>/content — Content and Brand<\u002Fh5><p>Lead value: \"We own your voice, content calendar, shoots, reels, statics and reporting so your brand shows up clearly every week.\" Accent the weekly-rhythm and consistency story.<\u002Fp><\u002Fdiv>\n    <div><h5>/influencer — Creator Campaigns<\u002Fh5><p>Lead value: \"We source, brief, contract, track and report creators so you know which posts drove reach, clicks, orders and reusable assets.\" Accent measurement and borrowed trust.<\u002Fp><\u002Fdiv>\n    <div><h5>/web — Web and Tech<\u002Fh5><p>Lead value: \"We write, design and build websites, landers, Shopify surfaces and lightweight tools that turn attention into leads or sales.\" Accent build speed and conversion.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n\n  <p class=\"prompt-label\">Build each service page with this (swap the bracketed bits):<\u002Fp>\n  <div class=\"prompt\">Build a SERVICE page for <hl>[Content and Brand → route /content]<\u002Fhl> on the dark system with shared nav/footer. Template:\n\n1. HERO — service name label, sharp value H1, support line = <hl>[the copy-bank value line for this service]<\u002Fhl>, \"Start a project →\" CTA (to /contact with this service preselected), supporting visual right.\n2. PROBLEM — centered (700px): the specific pain this service removes.\n3. THE SYSTEM — numbered timeline of how we run it, full width.\n4. WHAT WE MANAGE / DELIVER — deliverables grid.\n5. TYPES / PACKAGES — work-type or engagement cards.\n6. PROOF — tracking/results + 1–2 relevant case examples.\n7. FAQ — service-specific accordion.\n8. NEXT MOVE — closing CTA to /contact, service preselected.\n\nUse one service vocabulary across the site: Content and Brand · Creator Campaigns · Web and Tech · Campaign Launches. Do NOT add unverified case studies or sections; if proof is not approved, keep proof minimal rather than inventing it.\n\nRepeat for: <b>[Creator Campaigns → /influencer]<\u002Fb> and <b>[Web and Tech → /web]<\u002Fb>, swapping the value line, problem, and emphasis per the brief.<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 09 CAMPAIGN LAUNCHES ============ -->\n<section class=\"section\" id=\"campaigns\">\n  <div class=\"kicker\">09 · The fourth service · /campaigns<\u002Fdiv>\n  <h2>Campaign Launches needs a real home.<\u002Fh2>\n  <p class=\"lead\"><strong>P0 from the audit.<\u002Fstrong> The home page promises four services but only three have a destination today; \"Campaigns\" currently links to Contact with nothing preselected. Pick one route and make it deliberate.<\u002Fp>\n\n  <div class=\"anatomy\">\n    <div><h5>Option A — dedicated page<\u002Fh5><p>Build <code>/campaigns<\u002Fcode> using the same service-page template (§08). Strongest if launches are a real, sellable line. Add it as a reachable destination from the home services grid and footer.<\u002Fp><\u002Fdiv>\n    <div><h5>Option B — preselected Contact route<\u002Fh5><p>Keep Campaign Launches as a CTA into <code>/contact<\u002Fcode> with the service prefilled (hidden or preselected field) so the brief arrives tagged. Lighter, but the four-service promise must still resolve.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"keep\"><span class=\"lbl\">Copy · Campaign Launches<\u002Fspan><p>\"We shape the idea, visual world, shoot, creator layer and rollout plan for launches that need to travel fast.\"<\u002Fp><\u002Fdiv>\n\n  <p class=\"prompt-label\">Recommended (Option A) prompt:<\u002Fp>\n  <div class=\"prompt\">Build /campaigns \"Campaign Launches\" using the service-page template on the dark system. Value line: \"We shape the idea, visual world, shoot, creator layer and rollout plan for launches that need to travel fast.\" Sections: Hero → Problem (launches that fizzle) → The system (concept → visual world → shoot → creator layer → rollout) → What we deliver → Launch types → Proof → FAQ → CTA to /contact (preselect \"Campaign Launches\"). Add this page to the home services grid and footer so all four service paths resolve.\n\nIf you instead choose Option B, skip the page and make the home \"Campaign Launches\" card link to /contact?service=campaign-launches with that service preselected in the form.<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 10 CONTACT ============ -->\n<section class=\"section\" id=\"contact\">\n  <div class=\"kicker\">10 · Contact page · /contact<\u002Fdiv>\n  <h2>Contact — one clean conversion surface.<\u002Fh2>\n  <p class=\"lead\"><strong>Goal:<\u002Fstrong> make starting a project effortless and route the brief to the right service. Every \"Start a project\" / \"Start a campaign\" CTA across the site lands here.<\u002Fp>\n\n  <table class=\"spec num-col\">\n    <thead><tr><th>#<\u002Fth><th>Section<\u002Fth><th>Content<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>01<\u002Ftd><td>Hero<\u002Ftd><td>Short headline (\"Tell us the stuck point\") + the studio one-liner. Centered, 700px.<\u002Ftd><\u002Ftr>\n      <tr><td>02<\u002Ftd><td>Project form<\u002Ftd><td>Name, email, brand/company, <strong>service select (Content and Brand · Creator Campaigns · Web and Tech · Campaign Launches)<\u002Fstrong> that accepts a preselect from the source CTA, budget/timeline optional, message. Validation + success + error states.<\u002Ftd><\u002Ftr>\n      <tr><td>03<\u002Ftd><td>Direct contact<\u002Ftd><td>Email (contact@seetusk.com), location (Pune, India), social links.<\u002Ftd><\u002Ftr>\n      <tr><td>04<\u002Ftd><td>Footer<\u002Ftd><td>Shared footer (§04).<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <p class=\"prompt-label\">Build Contact with this:<\u002Fp>\n  <div class=\"prompt\">Build the CONTACT page (/contact) on the dark system with shared nav/footer. Centered 700px.\n\n1. HERO — \"Tell us the stuck point: quiet content, underused creators, a launch coming up, or a site that doesn't carry the brand. We'll give you a straight read and a practical way to fix it.\"\n2. PROJECT FORM — fields: name, email, brand/company, SERVICE select (Content and Brand · Creator Campaigns · Web and Tech · Campaign Launches) that auto-selects from a ?service= query param so CTAs arrive pre-tagged, optional budget &amp; timeline, message. Submit \"Start a project →\". Connect to the backend; show inline validation, a success confirmation state, and an error state. Fully keyboard accessible, visible focus, blue focus ring on dark fields.\n3. DIRECT CONTACT — contact@seetusk.com, Pune India, social icons.<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 11 SITEWIDE ============ -->\n<section class=\"section\" id=\"sitewide\">\n  <div class=\"kicker\">11 · Sitewide requirements<\u002Fdiv>\n  <h2>Final pass — apply across every page.<\u002Fh2>\n\n  <h3>Navigation &amp; CTAs<\u002Fh3>\n  <ul>\n    <li>Top nav identical on every page: Content · Creators · Web &amp; Tech · About. Careers + Contact in the footer.<\u002Fli>\n    <li>Resolve the Campaign Launches gap deliberately (§09).<\u002Fli>\n    <li>Every CTA opens a real, intent-matched destination. \"See the work\" anchors to and scrolls to the case-studies section. \"View case\" opens real proof, never a service page or dead link.<\u002Fli>\n    <li>If real case pages exist, a \"Work\" destination should be reachable.<\u002Fli>\n  <\u002Ful>\n\n  <h3>SEO &amp; metadata<\u002Fh3>\n  <ul>\n    <li><strong>Lock one canonical domain<\u002Fstrong> (build is on dev.seetusk.com, tags say seetusk.agency, audit reviewed seetusk.com). Pick the production domain; make canonical, og:url, sitemap and internal links all use it, with 301s from the rest.<\u002Fli>\n    <li>Keep title + meta description aligned to the service architecture and the one-liner.<\u002Fli>\n    <li>Add Organization + Service schema with correct contact details, address and social links.<\u002Fli>\n  <\u002Ful>\n\n  <h3>Accessibility checklist<\u002Fh3>\n  <ul>\n    <li>Honor <code>prefers-reduced-motion<\u002Fcode> on hero, marquee, and all scroll/ticker motion.<\u002Fli>\n    <li>Visible keyboard focus on nav links, service/case cards, FAQ accordions, and every CTA.<\u002Fli>\n    <li>Each card is a single link with a clear accessible name, not a block of separate clickable fragments.<\u002Fli>\n    <li>Headings read as whole words for screen readers even when letters animate individually.<\u002Fli>\n    <li>AA contrast for grey-on-dark body, small uppercase labels, accents, and ticker lines.<\u002Fli>\n    <li>Descriptive alt on real images; decorative duplicate marquee logos are <code>aria-hidden<\u002Fcode> / empty alt.<\u002Fli>\n  <\u002Ful>\n\n  <h3>Responsive<\u002Fh3>\n  <div class=\"pillrow\">\n    <span class=\"pill\">Desktop ≥1440px · 12 col · 120px sections<\u002Fspan>\n    <span class=\"pill\">Tablet 768–1023px · 8 col · 80px<\u002Fspan>\n    <span class=\"pill\">Mobile ≤767px · 4 col · 64px<\u002Fspan>\n  <\u002Fdiv>\n\n  <p class=\"prompt-label\">Final QA prompt:<\u002Fp>\n  <div class=\"prompt\">Do a sitewide QA pass. Confirm: top nav is identical on every page (Content · Creators · Web &amp; Tech · About; Careers + Contact in footer); all four service paths are reachable; every CTA opens a real intent-matched destination; \"See the work\" scrolls to case studies; \"View case\" opens real proof not a service page; newsletter lives in the footer only with success/error states; one canonical domain across canonical/og/sitemap/internal links + Organization &amp; Service schema; prefers-reduced-motion respected; visible keyboard focus everywhere; cards are single links; headings expose whole words; AA contrast on the dark base; images have useful alt and decorative marquee logos are aria-hidden. Verify the three responsive breakpoints (≥1440 / 768–1023 / ≤767).<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 12 ASSETS ============ -->\n<section class=\"section\" id=\"assets\">\n  <div class=\"kicker\">12 · Asset inventory<\u002Fdiv>\n  <h2>What already exists to build with.<\u002Fh2>\n\n  <h3>Clients (logo wall)<\u002Fh3>\n  <p>Bamboo India · Force Motors · NIFT · Jeevitnadi · Visda Organix · MyFitness · car&amp;bike · Coffee Cup · Kundan Spaces · Pune River Revival · Tridrashya · The Comedy Clubhouse · Hindustan Unilever · FIRVT · WTF · Clover&amp;co.<\u002Fp>\n\n  <h3>Case studies (named, ready to flesh out)<\u002Fh3>\n  <table class=\"spec\">\n    <thead><tr><th>Brand<\u002Fth><th>Type<\u002Fth><th>Angle<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>Ambar Coffee<\u002Ftd><td>F&amp;B / Content<\u002Ftd><td>Weekly cafe content that fills tables.<\u002Ftd><\u002Ftr>\n      <tr><td>FIRVT<\u002Ftd><td>Launch / Creators<\u002Ftd><td>Launch coverage that outran a quarter of paid.<\u002Ftd><\u002Ftr>\n      <tr><td>DevKnight<\u002Ftd><td>Brand / Web<\u002Ftd><td>A brand and site that finally match.<\u002Ftd><\u002Ftr>\n      <tr><td>Fevistik<\u002Ftd><td>Campaign / OOH<\u002Ftd><td>An outdoor moment people remembered.<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <h3>Results metrics<\u002Fh3>\n  <div class=\"pillrow\">\n    <span class=\"pill\">12M+ views<\u002Fspan>\n    <span class=\"pill\">150+ assets shipped<\u002Fspan>\n    <span class=\"pill\">40+ shoot days<\u002Fspan>\n    <span class=\"pill\">25+ brands<\u002Fspan>\n  <\u002Fdiv>\n\n  <h3>Imagery<\u002Fh3>\n  <p>The existing repo carries a large editorial image library (<code>images/ed-*<\u002Fcode>, product and BTS shots, client logos, the SCA mark). Reuse these for hero visuals, case media, and service supporting art. Apply the dark-system image treatment: 20px radius, soft shadow, consistent aspect ratios. Supply real photography for founders and case detail.<\u002Fp>\n\n  <div class=\"note\"><span class=\"lbl\">Source of truth<\u002Fspan><p>This brief consolidates the SeeTusk Website Functionality &amp; Messaging Audit (25 Jun 2026), the Home / About / Careers change specifications, the Proposed Sitemap, and the Design System Standards. Where copy is marked \"verbatim\", it is approved wording — keep it intact through the build.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n<\u002Ftd><\u002Ftr><\u002Ftbody>\n<tfoot><tr><td class=\"ftr-space\"><\u002Ftd><\u002Ftr><\u002Ftfoot>\n<\u002Ftable>\n<\u002Fmain>\n\n\n<\u002Fbody><\u002Fhtml>"
